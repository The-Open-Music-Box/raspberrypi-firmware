name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  # Run tests before building release
  test:
    name: Run Tests
    runs-on: [self-hosted, Linux, ARM64, rpi]
    timeout-minutes: 15

    steps:
      - name: Checkout code
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive

      - name: Set up Python virtual environment
        run: |
          cd back
          python3 -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          cd back
          source venv/bin/activate
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run unit tests
        run: |
          cd back
          source venv/bin/activate
          export USE_MOCK_HARDWARE=true
          export ENVIRONMENT=test
          pytest app/tests/unit/ -v --tb=short

      - name: Run contract tests
        run: |
          cd back
          source venv/bin/activate
          export USE_MOCK_HARDWARE=true
          export ENVIRONMENT=test
          pytest app/tests/contracts/ -v --tb=short || echo "No contract tests found"

  build-release:
    name: Build Release
    runs-on: [self-hosted, Linux, ARM64, rpi]
    needs: test

    steps:
      - name: Checkout code
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive

      - name: Setup Node.js
        # actions/setup-node@v4.2.0
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install frontend dependencies
        working-directory: front
        run: npm ci

      - name: Build frontend
        working-directory: front
        run: npm run build

      - name: Package release
        run: |
          # Create tomb directory structure
          mkdir -p tomb/app/static

          # Copy backend files (excluding dev files)
          rsync -a \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='logs' \
            --exclude='app.db' \
            --exclude='venv' \
            --exclude='.pytest_cache' \
            --exclude='tests' \
            back/app/ tomb/app/

          # Create flattened requirements.txt
          awk -v src_dir="back/requirements" '
            /^-r / {
              sub(/^-r /, "", $0);
              file = src_dir "/" $0;
              while ((getline line < file) > 0) print line;
              close(file);
              next;
            }
            { print }
          ' back/requirements/prod.txt > tomb/requirements.txt

          # Remove comments and blank lines from requirements
          sed -i '/^\s*#/d;/^\s*$/d' tomb/requirements.txt

          # Copy additional files
          [ -f back/README.md ] && cp back/README.md tomb/
          [ -f back/app.service ] && cp back/app.service tomb/
          [ -f back/LICENSE ] && cp back/LICENSE tomb/
          [ -f back/setup.sh ] && cp back/setup.sh tomb/ && chmod +x tomb/setup.sh
          [ -f back/start_app.py ] && cp back/start_app.py tomb/ && chmod +x tomb/start_app.py

          # Copy tools directory
          if [ -d back/tools ]; then
            cp -r back/tools tomb/
            chmod +x tomb/tools/*.py 2>/dev/null || true
          fi

          # Copy WM8960 driver files
          if [ -d back/drivers ]; then
            cp -r back/drivers tomb/
          fi

          # Copy .env template (without secrets)
          if [ -f back/.env.example ]; then
            cp back/.env.example tomb/.env
          elif [ -f back/.env ]; then
            cp back/.env tomb/.env
          fi

          # Copy frontend build
          cp -r front/dist/* tomb/app/static/

          # Create version file
          echo "${{ github.ref_name }}" > tomb/VERSION

          # Create versioned archives
          tar -czvf tomb-${{ github.ref_name }}.tar.gz tomb
          zip -r tomb-${{ github.ref_name }}.zip tomb

          # Create stable-named archives for /releases/latest/download/
          cp tomb-${{ github.ref_name }}.tar.gz tomb.tar.gz
          cp tomb-${{ github.ref_name }}.zip tomb.zip

      - name: Create GitHub Release
        # softprops/action-gh-release@v2.2.1
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631
        with:
          files: |
            tomb-${{ github.ref_name }}.tar.gz
            tomb-${{ github.ref_name }}.zip
            tomb.tar.gz
            tomb.zip
          generate_release_notes: true
          body: |
            ## Installation

            ### Quick install (always latest)
            ```bash
            wget -qO- https://github.com/${{ github.repository }}/releases/latest/download/tomb.tar.gz | tar -xz && cd tomb && sudo ./setup.sh
            sudo reboot
            ```

            ### Specific version
            ```bash
            wget -qO- https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/tomb-${{ github.ref_name }}.tar.gz | tar -xz && cd tomb && sudo ./setup.sh
            sudo reboot
            ```

            ### Option 2: Clone and build manually
            ```bash
            git clone https://github.com/${{ github.repository }}.git
            cd raspberrypi-firmware
            ./deploy.sh --build-only
            ```

            ---

            **Full Changelog**: https://github.com/${{ github.repository }}/compare/v${{ github.event.repository.default_branch }}...${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Export metrics to Pushgateway
        if: always()
        run: |
          RELEASE_SUCCESS=${{ job.status == 'success' && 1 || 0 }}
          cat <<EOF | curl --data-binary @- http://host.docker.internal:9091/metrics/job/release/instance/rpi-firmware
          release_success{repo="rpi-firmware",version="${{ github.ref_name }}"} ${RELEASE_SUCCESS}
          release_timestamp{repo="rpi-firmware",version="${{ github.ref_name }}"} $(date +%s)
          EOF
