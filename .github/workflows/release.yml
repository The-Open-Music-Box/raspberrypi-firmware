name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  USE_MOCK_HARDWARE: "true"
  ENVIRONMENT: test

jobs:
  test:
    name: Run Tests
    runs-on: [self-hosted, Linux, ARM64, rpi]
    timeout-minutes: 15

    steps:
      - name: Checkout code
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive

      - name: Set up Python virtual environment
        run: |
          cd back
          python3 -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          cd back
          source venv/bin/activate
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run unit tests
        run: |
          cd back
          source venv/bin/activate
          pytest tests/unit/ -v --tb=short

      - name: Run contract tests
        run: |
          cd back
          source venv/bin/activate
          pytest tests/contracts/ -v --tb=short || echo "No contract tests found"

  build-release:
    name: Build Release
    runs-on: [self-hosted, Linux, ARM64, rpi]
    needs: test
    timeout-minutes: 20

    steps:
      - name: Checkout code
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive

      - name: Setup Node.js
        # actions/setup-node@v4.3.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install frontend dependencies
        working-directory: front
        run: npm ci

      - name: Build frontend
        working-directory: front
        run: npm run build

      - name: Package release
        run: |
          VERSION="${{ inputs.version }}"

          # Create tomb directory structure
          mkdir -p tomb/app/static

          # Copy backend files (excluding dev files)
          rsync -a \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='logs' \
            --exclude='app.db' \
            --exclude='venv' \
            --exclude='.pytest_cache' \
            --exclude='tests' \
            back/app/ tomb/app/

          # Create flattened requirements.txt
          awk -v src_dir="back/requirements" '
            /^-r / {
              sub(/^-r /, "", $0);
              file = src_dir "/" $0;
              while ((getline line < file) > 0) print line;
              close(file);
              next;
            }
            { print }
          ' back/requirements/prod.txt > tomb/requirements.txt

          # Remove comments and blank lines from requirements
          sed -i '/^\s*#/d;/^\s*$/d' tomb/requirements.txt

          # Copy additional files
          [ -f back/README.md ] && cp back/README.md tomb/
          [ -f back/app.service ] && cp back/app.service tomb/
          [ -f back/LICENSE ] && cp back/LICENSE tomb/
          [ -f back/setup.sh ] && cp back/setup.sh tomb/ && chmod +x tomb/setup.sh
          [ -f back/start_app.py ] && cp back/start_app.py tomb/ && chmod +x tomb/start_app.py

          # Copy tools directory
          if [ -d back/tools ]; then
            cp -r back/tools tomb/
            chmod +x tomb/tools/*.py 2>/dev/null || true
          fi

          # Copy WM8960 driver files
          if [ -d back/drivers ]; then
            cp -r back/drivers tomb/
          fi

          # Copy .env template (without secrets)
          if [ -f back/.env.example ]; then
            cp back/.env.example tomb/.env
          elif [ -f back/.env ]; then
            cp back/.env tomb/.env
          fi

          # Copy frontend build
          cp -r front/dist/* tomb/app/static/

          # Create version file
          echo "$VERSION" > tomb/VERSION

          # Create versioned archives
          tar -czvf tomb-v${VERSION}.tar.gz tomb
          zip -r tomb-v${VERSION}.zip tomb

          # Create checksums
          sha256sum tomb-v${VERSION}.tar.gz tomb-v${VERSION}.zip > SHA256SUMS

      - name: Upload release artifacts
        # actions/upload-artifact@v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rpi-firmware-${{ inputs.version }}
          path: |
            tomb-v${{ inputs.version }}.tar.gz
            tomb-v${{ inputs.version }}.zip
            SHA256SUMS
          retention-days: 90

  publish:
    name: Publish Release
    runs-on: [self-hosted, Linux, ARM64, rpi]
    needs: build-release
    timeout-minutes: 10

    steps:
      - name: Checkout code
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Download artifacts
        # actions/download-artifact@v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rpi-firmware-${{ inputs.version }}
          path: /tmp/rpi-release

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Publish to release branch
        run: |
          VERSION="${{ inputs.version }}"

          # Fetch release branch or create it as orphan
          if git ls-remote --heads origin release | grep -q release; then
            git fetch origin release
            git checkout release
          else
            git checkout --orphan release
            git rm -rf . || true
            cat > README.md << 'EOF'
          # RPI Firmware Releases

          This branch contains release artifacts for the Raspberry Pi firmware.

          ## Installation

          ### Quick install (always latest)
          ```bash
          wget -qO- https://github.com/The-Open-Music-Box/raspberrypi-firmware/releases/latest/download/tomb.tar.gz | tar -xz && cd tomb && sudo ./setup.sh
          sudo reboot
          ```

          ### Specific version
          Download from the `releases/` directory and extract.
          EOF
            git add README.md
            git commit -m "Initialize release branch"
          fi

          # Create releases directory
          mkdir -p releases/$VERSION

          # Copy artifacts
          cp /tmp/rpi-release/* releases/$VERSION/

          # Create stable-named copies for latest
          cp releases/$VERSION/tomb-v${VERSION}.tar.gz releases/$VERSION/tomb.tar.gz
          cp releases/$VERSION/tomb-v${VERSION}.zip releases/$VERSION/tomb.zip

          # Create version info
          cat > releases/$VERSION/VERSION.txt << EOF
          Version: $VERSION
          Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Commit: ${{ github.sha }}
          EOF

          # Stage and commit
          git add releases/$VERSION/
          git commit -m "Release v$VERSION [skip ci]" || echo "No changes to commit"

          # Create version tag
          git tag -a "v$VERSION" -m "Release v$VERSION"

      - name: Push changes
        run: |
          git push origin release
          git push origin "v${{ inputs.version }}"

      - name: Export metrics to Pushgateway
        if: always()
        run: |
          RELEASE_SUCCESS=${{ job.status == 'success' && 1 || 0 }}
          cat <<EOF | curl --data-binary @- http://host.docker.internal:9091/metrics/job/release/instance/raspberrypi-firmware || true
          release_success{repo="raspberrypi-firmware",version="v${{ inputs.version }}"} ${RELEASE_SUCCESS}
          release_timestamp{repo="raspberrypi-firmware",version="v${{ inputs.version }}"} $(date +%s)
          EOF
