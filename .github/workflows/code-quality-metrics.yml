name: Code Quality Metrics

on:
  push:
    branches: [develop]
    paths:
      - "back/app/**"
      - "back/pyproject.toml"
      - "back/requirements*.txt"
  pull_request:
    branches: [develop]
  schedule:
    # Run daily at 6 AM UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

# Minimal permissions for security hardening
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  collect-metrics:
    name: Collect Code Quality Metrics
    runs-on: [self-hosted, Linux, ARM64, rpi]
    # Security: Only run on PRs from the same repository (not forks)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    defaults:
      run:
        working-directory: back

    steps:
    - name: Checkout repository
      # actions/checkout@v4.2.2
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Python 3.13 is pre-installed on self-hosted runner
      # - name: Set up Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: '3.11'
      #     cache: 'pip'

    - name: Set up Python virtual environment
      run: |
        rm -rf venv
        python3 -m venv venv
        source venv/bin/activate
        python -m pip install --upgrade pip
        echo "VIRTUAL_ENV=$PWD/venv" >> $GITHUB_ENV
        echo "$PWD/venv/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        source venv/bin/activate
        pip install -r requirements.txt
        pip install -r requirements-test.txt

    - name: Run tests with coverage
      run: |
        source venv/bin/activate
        export USE_MOCK_HARDWARE=true
        export ENVIRONMENT=test
        pytest tests/ -v \
          --cov=app \
          --cov-report=json:coverage.json \
          --cov-report=term-missing || echo "Tests failed but continuing for metrics"

    - name: Run metrics collection
      run: |
        source venv/bin/activate
        # Export metrics to Pushgateway if available (local CI only)
        if [ -n "$PUSHGATEWAY_URL" ]; then
          ./scripts/export_metrics.sh "$PUSHGATEWAY_URL"
        else
          echo "Skipping Pushgateway export (PUSHGATEWAY_URL not set)"
        fi
      env:
        GITHUB_REPOSITORY: ${{ github.repository }}
        PUSHGATEWAY_URL: ${{ vars.PUSHGATEWAY_URL }}

    - name: Generate metrics summary
      if: always()
      run: |
        source venv/bin/activate
        echo "## Code Quality Metrics Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY

        # Capture individual metrics for summary
        MYPY=$(mypy app/src --no-error-summary 2>&1 | grep -c "error:" || echo "0")
        echo "| Type Errors (mypy) | $MYPY |" >> $GITHUB_STEP_SUMMARY

        BANDIT=$(bandit -r app/src -f json 2>/dev/null | python3 -c "import sys, json; data=json.load(sys.stdin); print(len(data.get('results', [])))" || echo "0")
        echo "| Security Issues (bandit) | $BANDIT |" >> $GITHUB_STEP_SUMMARY

        RUFF=$(ruff check app/src --output-format=json 2>/dev/null | python3 -c "import sys, json; print(len(json.load(sys.stdin)))" || echo "0")
        echo "| Lint Issues (ruff) | $RUFF |" >> $GITHUB_STEP_SUMMARY

        VULTURE=$(vulture app/src --min-confidence 80 2>&1 | wc -l | tr -d ' ')
        echo "| Dead Code (vulture) | $VULTURE |" >> $GITHUB_STEP_SUMMARY

        DOCSTRING=$(interrogate app/src -v 2>&1 | grep "TOTAL" | awk '{print $NF}' || echo "0%")
        echo "| Docstring Coverage | $DOCSTRING |" >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "View detailed dashboard at: ${{ vars.DASHBOARD_URL || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
