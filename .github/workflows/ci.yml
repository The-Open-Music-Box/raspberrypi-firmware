# TheOpenMusicBox - RPI Firmware CI
# ==================================
# Runs on PR to develop branch
# Shows green checkmark on success, red X on failure
# Requires branch to be rebased on develop

name: CI

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

# Cancel in-progress runs for the same branch
concurrency:
  group: ci-rpi-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Minimal permissions for security hardening
permissions:
  contents: read

env:
  PUSHGATEWAY_URL: http://host.docker.internal:9091
  USE_MOCK_HARDWARE: "true"
  ENVIRONMENT: test

jobs:
  # Check if branch is rebased on develop
  check-rebase:
    name: Check Rebase Status
    runs-on: [self-hosted, Linux, ARM64, rpi]
    # Security: Only run on PRs from the same repository (not forks)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Check if rebased on develop
        run: |
          git fetch origin develop

          # Get the merge base between this branch and develop
          MERGE_BASE=$(git merge-base HEAD origin/develop)
          DEVELOP_HEAD=$(git rev-parse origin/develop)

          if [ "$MERGE_BASE" != "$DEVELOP_HEAD" ]; then
            echo "::error::Branch is not rebased on develop. Please rebase your branch."
            echo ""
            echo "Run the following commands:"
            echo "  git fetch origin develop"
            echo "  git rebase origin/develop"
            echo "  git push --force-with-lease"
            exit 1
          fi

          echo "Branch is up to date with develop"

  backend-tests:
    name: Backend Tests
    runs-on: [self-hosted, Linux, ARM64, rpi]
    needs: [check-rebase]
    # Security: Only run on PRs from the same repository (not forks)
    if: |
      always() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (needs.check-rebase.result == 'success' || needs.check-rebase.result == 'skipped')
    defaults:
      run:
        working-directory: back

    outputs:
      status: ${{ job.status }}

    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Python 3.13 is pre-installed on self-hosted runner
      # - name: Set up Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: '3.11'
      #     cache: 'pip'

      - name: Set up Python virtual environment
        run: |
          rm -rf venv
          python3 -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          echo "VIRTUAL_ENV=$PWD/venv" >> $GITHUB_ENV
          echo "$PWD/venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          source venv/bin/activate
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run unit tests
        id: unit-tests
        run: |
          source venv/bin/activate
          pytest tests/unit/ -v --tb=short --junitxml=test-results-unit.xml

      - name: Run contract tests
        id: contract-tests
        run: |
          source venv/bin/activate
          pytest tests/contracts/ -v --tb=short --junitxml=test-results-contracts.xml

      - name: Run integration tests
        id: integration-tests
        run: |
          source venv/bin/activate
          # Run integration tests with longer timeout for startup tests
          pytest tests/integration/ -v --tb=short --junitxml=test-results-integration.xml
        continue-on-error: false

      - name: Upload test results
        # actions/upload-artifact@v4.6.0
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: backend-test-results
          path: back/test-results-*.xml

  frontend-tests:
    name: Frontend Tests
    runs-on: [self-hosted, Linux, ARM64, rpi]
    needs: [check-rebase]
    # Security: Only run on PRs from the same repository (not forks)
    if: |
      always() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (needs.check-rebase.result == 'success' || needs.check-rebase.result == 'skipped')
    defaults:
      run:
        working-directory: front

    outputs:
      status: ${{ job.status }}

    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        # actions/setup-node@v4.2.0
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:unit

      - name: Upload test results
        # actions/upload-artifact@v4.6.0
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frontend-test-results
          path: front/test-results.xml
          if-no-files-found: ignore

  build-test:
    name: Build Test
    runs-on: [self-hosted, Linux, ARM64, rpi]
    needs: [backend-tests, frontend-tests]
    # Security: Only run on PRs from the same repository (not forks)
    if: |
      always() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.backend-tests.result == 'success' &&
      needs.frontend-tests.result == 'success'

    outputs:
      status: ${{ job.status }}

    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: true

      - name: Set up Node.js
        # actions/setup-node@v4.2.0
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Build frontend
        working-directory: front
        run: |
          npm ci
          npm run build

      - name: Verify build output
        run: |
          if [ ! -d "front/dist" ]; then
            echo "::error::Build failed - dist directory not found"
            exit 1
          fi
          echo "Build successful"
          ls -la front/dist/

  # Final status check - THIS IS THE REQUIRED CHECK FOR BRANCH PROTECTION
  ci-status:
    name: CI Status
    runs-on: [self-hosted, Linux, ARM64, rpi]
    needs: [check-rebase, backend-tests, frontend-tests, build-test]
    # Security: Only run for same-repo PRs
    if: always() && github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Check all jobs
        run: |
          echo "Check Rebase: ${{ needs.check-rebase.result }}"
          echo "Backend Tests: ${{ needs.backend-tests.result }}"
          echo "Frontend Tests: ${{ needs.frontend-tests.result }}"
          echo "Build Test: ${{ needs.build-test.result }}"

          # Treat 'skipped' as acceptable (fork PRs intentionally blocked)
          rebase_ok=${{ needs.check-rebase.result == 'success' || needs.check-rebase.result == 'skipped' }}
          backend_ok=${{ needs.backend-tests.result == 'success' || needs.backend-tests.result == 'skipped' }}
          frontend_ok=${{ needs.frontend-tests.result == 'success' || needs.frontend-tests.result == 'skipped' }}
          build_ok=${{ needs.build-test.result == 'success' || needs.build-test.result == 'skipped' }}

          if [[ "$rebase_ok" != "true" ]]; then
            echo "::error::Branch must be rebased on develop"
            exit 1
          fi

          if [[ "$backend_ok" != "true" ]]; then
            echo "::error::Backend tests failed"
            exit 1
          fi

          if [[ "$frontend_ok" != "true" ]]; then
            echo "::error::Frontend tests failed"
            exit 1
          fi

          if [[ "$build_ok" != "true" ]]; then
            echo "::error::Build test failed"
            exit 1
          fi

          echo "All CI checks passed!"
