[tool.isort]
skip = ["venv", "env", ".venv", "site-packages", "__pycache__", ".git"]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "venv",
    "tests",
    "build",
    "dist",
    "__pycache__"
]

# Per-module configuration for gradual adoption
[[tool.mypy.overrides]]
module = "app.src.*"
warn_return_any = true
warn_unused_ignores = true

[tool.bandit]
exclude_dirs = ["venv", "tests", "build", "dist", "__pycache__"]
# Skip low-confidence issues and some common false positives
skips = ["B101"]  # assert_used - acceptable in non-production code
targets = ["app/src"]

[tool.bandit.assert_used]
skips = ["*_test.py", "*test*.py"]

[tool.vulture]
min_confidence = 80
paths = ["app/src"]
exclude = ["venv", "tests", "build", "dist", "__pycache__"]
